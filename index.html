<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro SP3</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --danger: #dc2626;
            --success: #10b981;
            --bg: #eef2f5;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .credentials-bar {
            background-color: #1e293b;
            color: white;
            padding: 12px 18px;
            display: flex;
            gap: 15px;
            border-radius: 8px;
            font-size: 13px;
            align-items: center;
            flex-wrap: wrap;
        }
        .credentials-bar input {
            flex: 1;
            min-width: 180px;
            padding: 7px 10px;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #0f172a;
            color: #38bdf8;
            font-family: monospace;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
            box-sizing: border-box;
        }

        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .logo-left { font-weight: bold; font-size: 12px; color: #003366; line-height: 1.3; }
        .logo-right { font-weight: 900; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 6px;}
        .red-circle { width: 12px; height: 12px; background: var(--danger); border-radius: 50%; display: inline-block; }

        .main-title { text-align: center; color: #0f172a; margin: 10px 0 5px 0; font-size: 22px; }
        .title-divider { height: 3px; background: #0284c7; width: 100%; margin-bottom: 25px; }

        .content-grid {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 25px;
        }

        @media (max-width: 700px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .photo-upload-box {
            width: 100%;
            height: 240px;
            background-color: #fef9c3;
            border: 2px dashed #ca8a04;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .photo-upload-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        #preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }

        .fields-section { display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: flex; align-items: center; gap: 10px; }
        .form-row label { width: 110px; font-size: 13px; font-weight: 600; color: #475569; }
        .form-row input, textarea {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #f8fafc;
        }
        textarea { width: 100%; box-sizing: border-box; min-height: 75px; margin-top: 8px; }

        .btn-enviar {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-enviar:hover { background-color: #059669; }
        .btn-enviar:disabled { background-color: #94a3b8; }

        .records-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f1f5f9; color: #334155; font-weight: 700; }
        .badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            background: #dcfce7;
            color: #15803d;
        }
        .btn-danger-sm {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        #mensaje { text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
        #canvas { display: none; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Configuración Telegram -->
    <div class="credentials-bar">
        <label>Token Bot:</label>
        <input type="text" id="bot_token" value="8914153157:AAFYqHACXPnf6TUeSP2yXjFNs55AjN6Isnu">
        <label>Chat ID:</label>
        <input type="text" id="chat_id" value="7895192669">
    </div>

    <!-- Formulario -->
    <div class="container">
        <form id="formularioSP3">
            <div class="header-logos">
                <div class="logo-left">
                    REPÚBLICA BOLIVARIANA DE VENEZUELA<br>
                    MINISTERIO DEL PODER POPULAR PARA LA ENERGÍA ELÉCTRICA (MPPEE)
                </div>
                <div class="logo-right">
                    <span class="red-circle"></span> CORPOELEC
                </div>
            </div>

            <h2 class="main-title">Fuente de Información SP3 (SEBIN)</h2>
            <div class="title-divider"></div>

            <div class="content-grid">
                <div class="photo-upload-box">
                    <span style="font-size: 32px;">📷</span>
                    <span style="font-size: 12px; color: #854d0e; font-weight: bold; margin-top: 5px;">Click para cargar foto</span>
                    <img id="preview-img" alt="Preview">
                    <input type="file" id="foto" accept="image/*" required onchange="previewImage(event)">
                </div>

                <div class="fields-section">
                    <div class="form-row">
                        <label>Estado:</label>
                        <input type="text" id="estado" placeholder="Ej. Lara" required>
                    </div>
                    <div class="form-row">
                        <label>Municipio:</label>
                        <input type="text" id="municipio" placeholder="Ej. Iribarren" required>
                    </div>
                    <div class="form-row">
                        <label>Fecha:</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-row">
                        <label>Hora:</label>
                        <input type="time" id="hora" required>
                    </div>
                    <div class="form-row">
                        <label>Tipo Evento:</label>
                        <input type="text" id="tipo_evento" placeholder="Ej. Protesta" required>
                    </div>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">Descripción del evento:</label>
                <textarea id="descripcion" placeholder="Indique detalles de lo ocurrido..." required></textarea>
            </div>

            <button type="submit" id="btnEnviar" class="btn-enviar">REGISTRAR Y TRANSMITIR A TELEGRAM</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <!-- Registro Histórico Local -->
    <div class="records-section">
        <div class="records-header">
            <h3 style="margin: 0; color: #1e293b;">Historial de Reportes Guardados</h3>
            <button onclick="exportarCSV()" style="padding: 6px 12px; cursor: pointer; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; font-size: 12px;">Descargar Excel (CSV)</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>N° ID</th>
                        <th>Fecha / Hora</th>
                        <th>Ubicación</th>
                        <th>Tipo Evento</th>
                        <th>Telegram</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
        </div>
    </div>
</div>

<canvas id="canvas" width="800" height="600"></canvas>

<script>
    document.getElementById('fecha').valueAsDate = new Date();
    document.getElementById('hora').value = new Date().toTimeString().substring(0,5);

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('preview-img');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            if (context.measureText(testLine).width > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        context.fillText(line, x, y);
    }

    function guardarRegistro(datos) {
        let registros = JSON.parse(localStorage.getItem('sp3_registros') || '[]');
        registros.unshift(datos);
        localStorage.setItem('sp3_registros', JSON.stringify(registros));
        renderizarTabla();
    }

    function renderizarTabla() {
        const cuerpo = document.getElementById('tablaCuerpo');
        const registros = JSON.parse(localStorage.getItem('sp3_registros') || '[]');
        cuerpo.innerHTML = '';

        if(registros.length === 0) {
            cuerpo.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No hay registros acumulados.</td></tr>`;
            return;
        }

        registros.forEach((reg, index) => {
            cuerpo.innerHTML += `
                <tr>
                    <td><strong>#${reg.id}</strong></td>
                    <td>${reg.fecha} ${reg.hora}</td>
                    <td>${reg.estado} - ${reg.municipio}</td>
                    <td>${reg.tipo_evento}</td>
                    <td><span class="badge">Enviado</span></td>
                    <td><button class="btn-danger-sm" onclick="borrarRegistro(${index})">Eliminar</button></td>
                </tr>
            `;
        });
    }

    function borrarRegistro(index) {
        let registros = JSON.parse(localStorage.getItem('sp3_registros') || '[]');
        registros.splice(index, 1);
        localStorage.setItem('sp3_registros', JSON.stringify(registros));
        renderizarTabla();
    }

    function exportarCSV() {
        const registros = JSON.parse(localStorage.getItem('sp3_registros') || '[]');
        if (registros.length === 0) return alert('No hay reportes para exportar.');
        
        let csv = "\uFEFFID,Fecha,Hora,Estado,Municipio,Tipo,Descripcion\n";
        registros.forEach(r => {
            csv += `"${r.id}","${r.fecha}","${r.hora}","${r.estado}","${r.municipio}","${r.tipo_evento}","${r.descripcion.replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `reportes_sp3_${Date.now()}.csv`;
        a.click();
    }

    function dibujarFicha(ctx, reg, fotoImg) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 800, 600);

        ctx.strokeStyle = "#0284c7";
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, 780, 580);

        ctx.fillStyle = "#003366";
        ctx.font = "bold 11px Arial";
        ctx.fillText("REPÚBLICA BOLIVARIANA DE VENEZUELA", 30, 32);
        ctx.fillText("MINISTERIO DEL PODER POPULAR PARA LA ENERGÍA ELÉCTRICA (MPPEE)", 30, 48);

        ctx.fillStyle = "#dc2626";
        ctx.font = "900 16px Arial";
        ctx.fillText("● CORPOELEC / SEBIN", 570, 42);

        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("FUENTE DE INFORMACIÓN SP3 (SEBIN)", 400, 85);
        ctx.textAlign = "left";

        ctx.fillStyle = "#0284c7";
        ctx.fillRect(30, 95, 740, 3);

        ctx.fillStyle = "#f1e4c3";
        ctx.fillRect(40, 120, 260, 260);
        ctx.strokeStyle = "#ca8a04";
        ctx.lineWidth = 2;
        ctx.strokeRect(40, 120, 260, 260);

        if (fotoImg) {
            ctx.drawImage(fotoImg, 40, 120, 260, 260);
        }

        ctx.fillStyle = "#dc2626";
        ctx.font = "900 22px Arial";
        ctx.fillText("ALERTA", 330, 145);

        ctx.font = "bold 15px Arial";
        ctx.fillStyle = "#334155";

        const campos = [
            { label: "Estado:", val: reg.estado },
            { label: "Municipio:", val: reg.municipio },
            { label: "Fecha:", val: reg.fecha.split('-').reverse().join('/') },
            { label: "Hora:", val: reg.hora },
            { label: "Tipo Evento:", val: reg.tipo_evento }
        ];

        let startY = 180;
        campos.forEach(c => {
            ctx.fillStyle = "#475569";
            ctx.font = "bold 14px Arial";
            ctx.fillText(c.label, 330, startY);

            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(440, startY - 18, 320, 26);
            ctx.strokeStyle = "#cbd5e1";
            ctx.strokeRect(440, startY - 18, 320, 26);

            ctx.fillStyle = "#000000";
            ctx.font = "bold 14px Arial";
            ctx.fillText(c.val, 450, startY);

            startY += 38;
        });

        ctx.fillStyle = "#1e293b";
        ctx.font = "bold 15px Arial";
        ctx.fillText("Descripción del evento", 40, 415);
        ctx.strokeStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.moveTo(210, 410);
        ctx.lineTo(760, 410);
        ctx.stroke();

        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(40, 425, 720, 105);
        ctx.strokeStyle = "#cbd5e1";
        ctx.strokeRect(40, 425, 720, 105);

        ctx.fillStyle = "#111827";
        ctx.font = "14px Arial";
        wrapText(ctx, reg.descripcion, 55, 450, 690, 22);

        ctx.fillStyle = "#dc2626";
        ctx.font = "italic bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Prevenir es Proteger", 400, 555);

        ctx.fillStyle = "#000000";
        ctx.font = "bold 11px Arial";
        ctx.fillText("— Fuente: Exploradores territoriales del SP3 —", 400, 575);
        ctx.textAlign = "left";
    }

    document.getElementById('formularioSP3').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnEnviar');
        const mensaje = document.getElementById('mensaje');
        btn.innerHTML = "⏳ REGISTRANDO Y ENVIANDO...";
        btn.disabled = true;
        mensaje.innerText = "";

        const TELEGRAM_TOKEN = document.getElementById('bot_token').value.trim();
        const CHAT_ID = document.getElementById('chat_id').value.trim();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const registroActual = {
            id: Date.now().toString().slice(-5),
            estado: document.getElementById('estado').value,
            municipio: document.getElementById('municipio').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            tipo_evento: document.getElementById('tipo_evento').value,
            descripcion: document.getElementById('descripcion').value
        };

        const fotoInput = document.getElementById('foto').files[0];
        const reader = new FileReader();

        reader.onload = function(event) {
            const fotoUsuario = new Image();
            fotoUsuario.onload = function() {
                dibujarFicha(ctx, registroActual, fotoUsuario);

                canvas.toBlob(function(blob) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, `reporte_${registroActual.id}.jpg`);
                    formData.append('caption', `🚨 *REGISTRO SP3 [ID: ${registroActual.id}]*\n📍 *Lugar:* ${registroActual.estado}, ${registroActual.municipio}\n⚡ *Evento:* ${registroActual.tipo_evento}\n📅 *Fecha:* ${registroActual.fecha} ${registroActual.hora}\n\n📝 *Detalle:* ${registroActual.descripcion}`);

                    // Creación del Botón Interactivo (Teclado en línea)
                    const tecladoBotones = {
                        inline_keyboard: [
                            [
                                { text: "🔍 Ver Reporte Oficial SP3", url: "https://jorje1307.github.io/sistema-sp3/" },
                                { text: "✅ Confirmar Recibido", callback_data: "confirmado" }
                            ]
                        ]
                    };
                    formData.append('reply_markup', JSON.stringify(tecladoBotones));

                    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.ok) {
                            mensaje.innerText = "✅ Reporte transmitido a Telegram con botón interactivo.";
                            mensaje.style.color = "#10b981";
                            guardarRegistro(registroActual);
                            document.getElementById('formularioSP3').reset();
                            document.getElementById('preview-img').style.display = 'none';
                            document.getElementById('fecha').valueAsDate = new Date();
                            document.getElementById('hora').value = new Date().toTimeString().substring(0,5);
                        } else {
                            mensaje.innerText = `❌ Error de Telegram: ${data.description || 'Verifique Token y Chat ID'}`;
                            mensaje.style.color = "#dc2626";
                        }
                    })
                    .catch(() => {
                        mensaje.innerText = "❌ Error de conexión al servidor de Telegram.";
                        mensaje.style.color = "#dc2626";
                    })
                    .finally(() => {
                        btn.innerHTML = "REGISTRAR Y TRANSMITIR A TELEGRAM";
                        btn.disabled = false;
                    });
                }, 'image/jpeg', 0.92);
            };
            fotoUsuario.src = event.target.result;
        };

        reader.readAsDataURL(fotoInput);
    });

    renderizarTabla();
</script>
</body>
</html>
